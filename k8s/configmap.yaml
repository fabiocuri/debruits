    {
      "back_footer": {
        "pt": "DE BRUITS É UM PROJETO QUE ACREDITA EM UM FUTURO MAIS ANALÓGICO, ONDE AS PESSOAS SE RECONECTAM E REDESCOBREM O PAPEL.\n\nO PAPEL QUE VOCÊ ESTÁ SEGURANDO FOI PRODUZIDO ARTESANALMENTE. TODO O PAPEL UTILIZADO PARA A RECICLAGEM FOI OBTIDO LOCALMENTE POR MEIO DE FEIRAS DE ANTIGUIDADES, COMPRAS INFORMAIS E DOAÇÕES. DESSA FORMA, APOIAMOS AS COMUNIDADES LOCAIS AO RESGATAR LIVROS QUE ESTÃO MUITO VELHOS, DESATUALIZADOS OU QUE DIFICILMENTE SERIAM VENDIDOS, DANDO AO PAPEL UMA NOVA FINALIDADE.",
        "en": "DE BRUITS IS A PROJECT THAT BELIEVES IN A MORE ANALOG FUTURE, WHERE PEOPLE RECONNECT AND REDISCOVER PAPER.\n\nTHE PAPER YOU ARE HOLDING WAS HANDCRAFTED. ALL THE PAPER USED FOR RECYCLING WAS SOURCED LOCALLY THROUGH ANTIQUE FAIRS, INFORMAL PURCHASES AND DONATIONS. THIS WAY, WE SUPPORT LOCAL COMMUNITIES BY RESCUING BOOKS THAT ARE TOO OLD, OUTDATED OR UNLIKELY TO BE SOLD, GIVING THE PAPER A NEW PURPOSE.",
        "es": "DE BRUITS ES UN PROYECTO QUE CREE EN UN FUTURO MÁS ANALÓGICO, DONDE LAS PERSONAS SE RECONECTAN Y REDESCUBREN EL PAPEL.\n\nEL PAPEL QUE ESTÁS SOSTENIENDO FUE PRODUCIDO ARTESANALMENTE. TODO EL PAPEL UTILIZADO PARA EL RECICLAJE FUE OBTENIDO LOCALMENTE A TRAVÉS DE FERIAS DE ANTIGÜEDADES, COMPRAS INFORMALES Y DONACIONES. DE ESTA MANERA, APOYAMOS A LAS COMUNIDADES LOCALES AL RESCATAR LIBROS QUE ESTÁN MUY VIEJOS, DESACTUALIZADOS O QUE DIFÍCILMENTE SERÍAN VENDIDOS, DANDO AL PAPEL UN NUEVO PROPÓSITO.",
        "fr": "DE BRUITS EST UN PROJET QUI CROIT EN UN FUTUR PLUS ANALOGIQUE, OÙ LES GENS SE RECONNECTENT ET REDÉCOUVRENT LE PAPIER.\n\nLE PAPIER QUE VOUS TENEZ A ÉTÉ PRODUIT ARTISANALEMENT. TOUT LE PAPIER UTILISÉ POUR LE RECYCLAGE A ÉTÉ OBTENU LOCALEMENT DANS DES MARCHÉS AUX PUCES, DES ACHATS INFORMELS ET DES DONS. AINSI, NOUS SOUTENONS LES COMMUNAUTÉS LOCALES EN SAUVANT DES LIVRES TROP VIEUX, DÉPASSÉS OU QUI NE SERAIENT PAS FACILEMENT VENDUS, DONNANT AU PAPIER UNE NOUVELLE FINALITÉ."
      },
      "back_description": {
