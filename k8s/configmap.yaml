        "en": "DE BRUITS IS A PROJECT THAT BELIEVES IN A MORE ANALOG FUTURE, WHERE PEOPLE RECONNECT AND REDISCOVER PAPER.\n\nTHE FANZINE YOU ARE HOLDING WAS HANDCRAFTED. ALL THE PAPER USED FOR RECYCLING WAS SOURCED LOCALLY THROUGH ANTIQUE FAIRS, INFORMAL PURCHASES AND DONATIONS. THIS WAY, WE SUPPORT LOCAL COMMUNITIES BY RESCUING BOOKS THAT ARE TOO OLD, OUTDATED OR UNLIKELY TO BE SOLD, GIVING THE PAPER A NEW PURPOSE.",
