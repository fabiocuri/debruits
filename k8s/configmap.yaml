        "fr": "DE BRUITS EST UN PROJET QUI CROIT EN UN FUTUR PLUS ANALOGIQUE, OÙ LES GENS SE RECONNECTENT ET REDÉCOUVRENT LE PAPIER.\n\nLE FANZINE QUE VOUS TENEZ A ÉTÉ PRODUIT ARTISANALEMENT. TOUT LE PAPIER UTILISÉ POUR LE RECYCLAGE A ÉTÉ OBTENU LOCALEMENT DANS DES MARCHÉS AUX PUCES, DES ACHATS INFORMELS ET DES DONS. AINSI, NOUS SOUTENONS LES COMMUNAUTÉS LOCALES EN SAUVANT DES LIVRES TROP VIEUX, DÉPASSÉS OU QUI NE SERAIENT PAS FACILEMENT VENDUS, DONNANT AU PAPIER UNE NOUVELLE FINALITÉ."
